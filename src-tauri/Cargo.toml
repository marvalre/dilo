[package]
name = "dicta"
version = "0.1.0"
description = "Hold a key, talk, and your words land at the cursor."
edition = "2021"
license = "MIT"

[lib]
name = "dicta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
transcribe-rs = { version = "0.3.11", features = ["onnx"] }
handy-keys = "0.3.4"
cpal = "0.16"
rubato = "0.16"
enigo = "0.6"
arboard = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
whatlang = "0.16"
hound = "3.5"
regex = "1"
tauri-plugin-autostart = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-av-foundation = { version = "0.3", features = ["AVCaptureDevice", "AVMediaFormat"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
